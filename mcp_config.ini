[mcp]
safe_mode = true
# External MCP tool exposure: full (default), progressive, or core.
# Progressive lists the common tools and finds the rest on demand, which saves most
# of the context full spends on every request; it suits local or smaller models.
tool_profile = full
# How the listed tools are documented to the model: hybrid (default), signature or complete.
# hybrid shows the common tools in full and the others as one-line Python-style signatures;
# tool_help(name) returns any tool's full manual. complete sends every full JSON Schema.
tool_docs = hybrid
# TCP fallback is opt-in via the MCP Start macroscript. Keep idle polling sparse
# to avoid viewport stutter when the native bridge is unavailable.
tcp_idle_poll_interval_ms = 1500
tcp_active_poll_interval_ms = 50
tcp_active_poll_ticks_after_request = 10
