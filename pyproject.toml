[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3dsmax-mcp"
version = "1.7.0"
description = "MCP server for AI agents to control Autodesk 3ds Max"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
3dsmax-mcp = "src.server:main"
