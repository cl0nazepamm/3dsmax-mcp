[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3dsmax-mcp"
version = "1.6.6"
description = "MCP server for AI agents to control Autodesk 3ds Max"
# Bilingual landing page — this is the PyPI project page, and domestic Chinese PyPI
# mirrors index it, so it carries the pitch in both languages. Not README.md: that one
# uses relative image/doc links that do not resolve on PyPI.
readme = "docs/PYPI.md"
license = { file = "LICENSE" }
authors = [{ name = "clone - m3org", email = "cl0nazepam@proton.me" }]
requires-python = ">=3.12"
keywords = [
    "3dsmax",
    "3ds-max",
    "autodesk",
    "mcp",
    "model-context-protocol",
    "ai",
    "agent",
    "archviz",
    "maxscript",
    "tyflow",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # mcp 2.0 removed mcp.server.fastmcp (now mcp.server.mcpserver). Keep the
    # upper bound until server.py is ported, or fresh resolves break on import.
    "mcp[cli]>=1.0.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/cl0nazepamm/3dsmax-mcp"
Repository = "https://github.com/cl0nazepamm/3dsmax-mcp"
Issues = "https://github.com/cl0nazepamm/3dsmax-mcp/issues"
Changelog = "https://github.com/cl0nazepamm/3dsmax-mcp/blob/master/docs/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["maxmcp"]

# Ship the Max-side payload inside the package, keeping the SAME relative layout the
# repo uses. install.py resolves everything from `ROOT = Path(__file__).parent`, so it
# runs unmodified in both modes: ROOT is the repo root from a checkout, and the
# installed `maxmcp/` directory from a wheel. Same for scripts/build_skill.py
# (ROOT = parent.parent). Sources are native/bin (tracked) rather than the staged
# bundle/Contents/bin copies (gitignored), so a release builds from a clean checkout.
[tool.hatch.build.targets.wheel.force-include]
"install.py" = "maxmcp/installer.py"
"pyproject.toml" = "maxmcp/pyproject.toml"
"mcp_config.ini" = "maxmcp/mcp_config.ini"
"maxscript" = "maxmcp/maxscript"
"native/bin" = "maxmcp/native/bin"
"bundle/PackageContents.xml.in" = "maxmcp/bundle/PackageContents.xml.in"
"skills/3dsmax-mcp-dev" = "maxmcp/skills/3dsmax-mcp-dev"
"scripts/build_skill.py" = "maxmcp/scripts/build_skill.py"
"scripts/render_signal_wait.ps1" = "maxmcp/scripts/render_signal_wait.ps1"

[project.scripts]
3dsmax-mcp = "maxmcp.server:main"
3dsmax-mcp-install = "maxmcp.installer:main"
