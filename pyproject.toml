[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3dsmax-mcp"
version = "2.0.0"
description = "MCP server for AI agents to control Autodesk 3ds Max"
# Bilingual landing page — this is the PyPI project page, and domestic Chinese PyPI
# mirrors index it, so it carries the pitch in both languages. Not README.md: that one
# uses relative image/doc links that do not resolve on PyPI.
readme = "docs/PYPI.md"
license = { file = "LICENSE" }
authors = [{ name = "clone - m3org", email = "cl0nazepam@proton.me" }]
requires-python = ">=3.13"
keywords = [
    "3dsmax",
    "3ds-max",
    "autodesk",
    "mcp",
    "model-context-protocol",
    "ai",
    "agent",
    "archviz",
    "maxscript",
    "tyflow",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # mcp 2.0 removed mcp.server.fastmcp (now mcp.server.mcpserver). Keep the
    # upper bound until server.py is ported, or fresh resolves break on import.
    "mcp[cli]>=1.0.0,<2.0.0",
    # Cosmos search contact sheets (thumbnail decode/resize/compose).
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/cl0nazepamm/3dsmax-mcp"
Repository = "https://github.com/cl0nazepamm/3dsmax-mcp"
Issues = "https://github.com/cl0nazepamm/3dsmax-mcp/issues"
Changelog = "https://github.com/cl0nazepamm/3dsmax-mcp/blob/master/docs/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["maxmcp"]
# The tool layer's packages for the Python of each 3ds Max before 2027: gitignored, so
# named here. scripts/release/vendor_inmax.py installs them before a release build.
artifacts = ["maxmcp/inmax/site/cp*/**"]

# Ship what the installer needs from outside the package inside it, keeping the SAME
# relative layout the repo uses. install.py resolves these from
# `ROOT = Path(__file__).parent`, so it runs unmodified in both modes: ROOT is the repo
# root from a checkout, and the installed `maxmcp/` directory from a wheel. The bridges
# and their _mx come from
# native/bin, where a build stages them; they are not in the repository, so a release
# builds all five first. The config template, bundle manifest and
# MAXScript listener already live in the package, under maxmcp/assets.
[tool.hatch.build.targets.wheel.force-include]
"install.py" = "maxmcp/installer.py"
"pyproject.toml" = "maxmcp/pyproject.toml"
"native/bin" = "maxmcp/native/bin"
"skills/3dsmax-mcp-dev" = "maxmcp/skills/3dsmax-mcp-dev"

[project.scripts]
3dsmax-mcp = "maxmcp.server:main"
3dsmax-mcp-install = "maxmcp.installer:main"
