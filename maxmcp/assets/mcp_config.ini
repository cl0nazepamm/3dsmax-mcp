[mcp]
safe_mode = true
# Which tools AI clients list: script (default), full, progressive or core.
# script lists run_python, and the model writes Python scripts that reach every other tool.
# full lists every tool, core the everyday ones, and progressive the common ones with
# find_tools and call_tool for the rest. A client sends its tool list with every request.
tool_profile = script
# In full, core and progressive, how the listed tools are documented: hybrid (default),
# signature or complete. hybrid sends the common tools in full and the others as one-line
# Python-style signatures; tool_help(name) returns any tool's full manual. complete sends
# every full JSON Schema.
tool_docs = hybrid
# TCP fallback is opt-in via the MCP Start macroscript. Keep idle polling sparse
# to avoid viewport stutter when the native bridge is unavailable.
tcp_idle_poll_interval_ms = 1500
tcp_active_poll_interval_ms = 50
tcp_active_poll_ticks_after_request = 10
